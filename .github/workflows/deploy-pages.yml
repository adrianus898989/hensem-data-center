name: Deploy Hensem to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rebuild restoration bundle
        run: python3 admin-preview/build-restoration.py
      # The historical suite exercises the removed Next.js /api routes. These
      # migration regressions cover the live static UI/data attribution paths;
      # the Edge Function is verified separately after deployment.
      - run: pnpm test:migration
      - run: pnpm test:platform-filters
      - run: pnpm test:comparisons
      - run: pnpm test:security-identity
      - run: pnpm test:collector-control
      - run: pnpm test:admin-preview
      - run: pnpm test:wg-realtime
      - run: pnpm test:wg-existing
      - run: pnpm test:duoli
      - run: pnpm test:yash
      - run: pnpm test:ar-middle-channels
      - run: pnpm test:withdraw-duration
      - run: pnpm build
        env:
          PAGES_BASE_PATH: /hensem-data-center
          NEXT_PUBLIC_SUPABASE_URL: https://gmfyfzsxpxmaqtuuwgxb.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_0DFLEmUvGBp1GYQ7jNo4IA_O1PeA9zV
          NEXT_PUBLIC_DASHBOARD_AUTH_ENABLED: "true"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./out

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
